<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk 2077 - Landing Page</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav>
      <h1>Cyberpunk 2077</h1>
      <ul>
        <li><a class="nav-link" href="#hero">Play</a></li>
        <li><a class="nav-link" href="#features">What's New</a></li>
        <li><a class="nav-link" href="#gallery">Media</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="hero">
      <h2>Welcome to Night City</h2>
      <p>Placeholder for the main hero pitch and description.</p>
      <button class="btn-primary">Play Now</button>
    </section>

    <section id="features">
      <h3>Game Features</h3>
      <div class="features-grid">
        <div class="feature-card">
          <p>Feature 1 details go here.</p>
        </div>
        <div class="feature-card">
          <p>Feature 2 details go here.</p>
        </div>
      </div>
    </section>

    <section id="gallery">
      <h3>Media Gallery</h3>
      <div class="media-grid">
        <img src="images/placeholder1.jpg" alt="First game screenshot placeholder">
        <img src="images/placeholder2.jpg" alt="Second game screenshot placeholder">
        <img src="images/placeholder3.jpg" alt="Third game screenshot placeholder">
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 CD PROJEKT RED S.A. All rights reserved.</p>
  </footer>

</body>
</html>
